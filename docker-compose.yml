services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartwatch
      POSTGRES_PASSWORD: smartwatch
      POSTGRES_DB: smartwatch
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
